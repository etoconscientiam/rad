<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RAKURS — новый заказ</title>
<style>
  :root { color-scheme: light; }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    background: #f4f3f0;
    color: #1a1a1a;
    max-width: 560px;
    margin: 0 auto;
    padding: 32px 20px 80px;
  }
  h1 { font-size: 1.4rem; margin-bottom: 4px; }
  p.hint { color: #666; margin-top: 0; margin-bottom: 28px; }
  form { display: flex; flex-direction: column; gap: 16px; }
  label { display: flex; flex-direction: column; gap: 6px; font-size: 0.9rem; font-weight: 600; }
  input, select, textarea {
    font: inherit;
    padding: 10px 12px;
    border: 1px solid #ccc;
    border-radius: 8px;
    background: #fff;
  }
  textarea { resize: vertical; min-height: 70px; }
  .row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  button {
    margin-top: 12px;
    padding: 14px;
    border: none;
    border-radius: 8px;
    background: #1a1a1a;
    color: #fff;
    font-size: 1rem;
    font-weight: 600;
    cursor: pointer;
  }
  button:disabled { opacity: 0.5; cursor: default; }
  #status { font-size: 0.9rem; min-height: 1.2em; }
  #status.ok { color: #1a7a3d; }
  #status.err { color: #b3261e; }
</style>
</head>
<body>
  <h1>Новый заказ RAKURS</h1>
  <p class="hint">Заполните — заказ уйдёт в трекер заказов.</p>

  <form id="order-form">
    <label>Тип изделия
      <select name="type" required>
        <option value="">— выберите —</option>
        <option>Каркас</option>
        <option>Стеллаж</option>
        <option>Стол</option>
        <option>Стол с тумбой</option>
      </select>
    </label>

    <div class="row">
      <label>Ширина, мм
        <input type="number" name="width" min="1" required>
      </label>
      <label>Глубина, мм
        <input type="number" name="depth" min="1" required>
      </label>
      <label>Высота, мм
        <input type="number" name="height" min="1" required>
      </label>
      <label>Количество
        <input type="number" name="qty" min="1" value="1" required>
      </label>
    </div>

    <label>Сечение профиля
      <select name="profile" required>
        <option>20×20</option>
        <option>30×30</option>
        <option>40×40</option>
      </select>
    </label>

    <div class="row">
      <label>Цвет металла
        <input type="text" name="metalColor" placeholder="напр. чёрный муар" required>
      </label>
      <label>Цвет ЛДСП
        <input type="text" name="ldspColor" placeholder="напр. дуб сонома">
      </label>
    </div>

    <label>Клиент — имя и контакт
      <input type="text" name="client" placeholder="имя, телефон или телеграм" required>
    </label>

    <label>Комментарий
      <textarea name="comment" placeholder="всё, что не влезло в поля выше"></textarea>
    </label>

    <button type="submit">Отправить заказ</button>
    <div id="status"></div>
  </form>

  <script>
    const form = document.getElementById('order-form');
    const status = document.getElementById('status');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const button = form.querySelector('button');
      button.disabled = true;
      status.textContent = 'Отправляю…';
      status.className = '';

      const data = Object.fromEntries(new FormData(form).entries());

      try {
        const res = await fetch('/api/order', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(data),
        });
        if (!res.ok) throw new Error(await res.text());
        status.textContent = 'Заказ отправлен ✓';
        status.className = 'ok';
        form.reset();
      } catch (err) {
        status.textContent = 'Не отправилось: ' + err.message;
        status.className = 'err';
      } finally {
        button.disabled = false;
      }
    });
  </script>
</body>
</html>
